{% extends 'base.html' %}

{% block content %}
<div class="auth-page-container">
    <div class="terminal-card">
        <a href="/" class="close-btn">✕</a>

        <div class="terminal-header">
            <span class="status-dot"></span>
            <span>[ USER_REGISTRATION_PROTOCOL ]</span>
        </div>

        <form method="POST" class="terminal-form">
            {% csrf_token %}

            {% for field in form %}
            <div class="field-group">
                <label>>> {{ field.label|upper }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="error-text">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="execute-btn">
                EXECUTE_SIGN_UP
            </button>
        </form>

        <div class="terminal-footer">
            Уже зареєстровані? <a href="{% url 'login' %}">_RETURN_TO_LOGIN</a>
        </div>
    </div>
</div>

<style>
    .auth-page-container {
        display: flex;
        justify-content: center; /* Центруємо по горизонталі */
        align-items: center;     /* Центруємо по вертикалі */
        min-height: calc(100vh - 150px);
        padding: 40px 20px;
    }

    .terminal-card {
        background: rgba(10, 20, 35, 0.9);
        border: 1px solid #00d4ff;
        padding: 40px;
        width: 100%;
        max-width: 500px;
        position: relative;
        box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
    }

    /* Хрестик справа зверху */
    .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        color: #ff4d6d; /* Робимо червоним для акценту */
        text-decoration: none;
        font-size: 20px;
        font-weight: bold;
        transition: 0.3s;
    }

    .close-btn:hover {
        text-shadow: 0 0 10px #ff4d6d;
        transform: scale(1.2);
    }

    .terminal-header {
        color: #00d4ff;
        margin-bottom: 30px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .status-dot {
        width: 10px;
        height: 10px;
        background: #00ff9c;
        border-radius: 50%;
        box-shadow: 0 0 10px #00ff9c;
    }

    .field-group {
        margin-bottom: 20px;
    }

    .field-group label {
        display: block;
        color: #00d4ff;
        font-size: 14px;
        margin-bottom: 8px;
    }

    /* Стиль для інпутів Django форми */
    .field-group input,
    .field-group select {
        width: 100%;
        background: #000 !important;
        border: 1px solid #00d4ff !important;
        color: #00ff9c !important;
        padding: 12px;
        font-family: 'JetBrains Mono', monospace;
        outline: none;
    }

    .execute-btn {
        width: 100%;
        padding: 15px;
        background: #00ff9c;
        border: none;
        color: #081224;
        font-weight: 800;
        cursor: pointer;
        transition: 0.3s;
        text-transform: uppercase;
    }

    .execute-btn:hover {
        background: #00d4ff;
        box-shadow: 0 0 20px #00d4ff;
    }

    .terminal-footer {
        margin-top: 20px;
        text-align: center;
        font-size: 12px;
        color: #5a7d9a;
    }

    .terminal-footer a {
        color: #00d4ff;
        text-decoration: none;
        border-bottom: 1px solid transparent;
    }

    .terminal-footer a:hover {
        border-bottom: 1px solid #00d4ff;
    }
</style>
{% endblock %}
