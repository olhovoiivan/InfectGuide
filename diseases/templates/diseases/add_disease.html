{% extends 'base.html' %}

{% block content %}
<section class="analyzer-container">
    <div class="terminal-tag">DATABASE: ADD_NEW_ENTRY</div>
    <div class="analyzer-box">
        <form id="addDiseaseForm" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 20px;">
    {% csrf_token %}
    <input type="text" id="diseaseName" name="name" placeholder="Назва інфекційної хвороби..." required
           style="padding: 10px; background: #081224; border: 1px solid #00d4ff; color: #00ff9c;">

    <textarea id="diseaseDesc" name="description" placeholder="Медичний опис хвороби ..."
              style="padding: 10px; background: #081224; border: 1px solid #00d4ff; color: #00ff9c; height: 150px;"></textarea>

    <div style="border: 1px dashed #00d4ff; padding: 20px; text-align: center;">
        <label for="diseaseImage" style="color: #00d4ff; cursor: pointer;">
            > ВИБРАТИ_МАЛЮНОК_ХВОРОБИ ...
        </label>
        <input type="file" id="diseaseImage" name="image" accept="image/*" style="display: none;"
               onchange="document.getElementById('fileName').innerText = this.files[0].name">
        <div id="fileName" style="color: #00ff9c; margin-top: 10px; font-size: 12px;"></div>
    </div>

    <button type="submit" class="btn-execute-scan">ЗБЕРЕГТИ_В_РЕЄСТР (POST)</button>
</form>
    </div>
</section>

<script>
    // Тут ми підключимо RESTful API у наступному кроці плану
    document.getElementById('addDiseaseForm').onsubmit = function(e) {
        e.preventDefault();
        alert('Форма готова до відправки через Fetch API (POST)');
    };
</script>
{% endblock %}
