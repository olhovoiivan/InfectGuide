{% extends 'base.html' %}

{% block content %}
<div class="auth-page-container">
    <div class="terminal-card">
        <a href="/" class="close-btn">✕</a>

        <div class="terminal-header">
            <span class="status-dot"></span>
            <span>[ USER_AUTH_PROTOCOL ]</span>
        </div>

        <form method="POST" class="terminal-form">
            {% csrf_token %}

            <div class="field-group">
                <label>> LOGIN</label>
                <input type="text" name="username" required autocomplete="off">
            </div>

            <div class="field-group">
                <label>> PASSWORD</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="execute-btn">
                EXECUTE_LOGIN
            </button>
        </form>

        <div class="terminal-footer">
            Немає доступу? <a href="{% url 'register' %}">_CREATE_ACCOUNT</a>
        </div>
    </div>
</div>

<style>
    /* Центрування форми на екрані */
    .auth-page-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 160px);
        padding: 20px;
    }

    /* Картка терміналу */
    .terminal-card {
        background: rgba(10, 20, 35, 0.95);
        border: 1px solid #00d4ff;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        position: relative;
        box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
    }

    /* Кнопка закриття (хрестик) */
    .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        color: #ff4d6d;
        text-decoration: none;
        font-size: 20px;
        font-weight: bold;
        transition: 0.3s;
    }

    .close-btn:hover {
        text-shadow: 0 0 10px #ff4d6d;
        transform: scale(1.2);
    }

    /* Заголовок протоколу */
    .terminal-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 35px;
        color: #00d4ff;
        font-weight: 800;
        letter-spacing: 1px;
    }

    .status-dot {
        width: 10px;
        height: 10px;
        background: #00ff9c;
        border-radius: 50%;
        box-shadow: 0 0 10px #00ff9c;
        animation: blink 1.5s infinite;
    }

    @keyframes blink { 50% { opacity: 0.3; } }

    /* Поля вводу */
    .field-group {
        margin-bottom: 25px;
    }

    .field-group label {
        display: block;
        color: #00d4ff;
        font-size: 14px;
        margin-bottom: 10px;
        font-weight: 500;
    }

    .field-group input {
        width: 100%;
        background: #000 !important;
        border: 1px solid #00d4ff !important;
        color: #00ff9c !important;
        padding: 12px;
        font-family: 'JetBrains Mono', monospace;
        outline: none;
        transition: 0.3s;
    }

    .field-group input:focus {
        border-color: #00ff9c !important;
        box-shadow: 0 0 15px rgba(0, 255, 156, 0.3);
    }

    /* Кнопка входу - робимо її яскравою та видимою */
    .execute-btn {
        width: 100%;
        padding: 16px;
        background: #00ff9c;
        border: none;
        color: #081224;
        font-weight: 800;
        font-family: 'JetBrains Mono', monospace;
        cursor: pointer;
        text-transform: uppercase;
        margin-top: 10px;
        transition: 0.3s;
    }

    .execute-btn:hover {
        background: #00d4ff;
        box-shadow: 0 0 25px #00d4ff;
        transform: translateY(-2px);
    }

    /* Футер форми */
    .terminal-footer {
        margin-top: 30px;
        text-align: center;
        font-size: 13px;
        color: #5a7d9a;
    }

    .terminal-footer a {
        color: #00d4ff;
        text-decoration: none;
        margin-left: 5px;
    }

    .terminal-footer a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
