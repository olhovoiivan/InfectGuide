{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* ===== ГОЛОВНИЙ КОНТЕЙНЕР ===== */
    .main-content {
        padding-top: 80px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 50px;
        min-height: 100vh;
    }

    /* ===== TERMINAL TAG (ID ЯРЛИК) ===== */
    .terminal-tag {
        background: #00d4ff;
        color: #050c18;
        padding: 6px 18px;
        font-weight: 800;
        font-size: 13px;
        align-self: flex-start;
        margin-left: calc(50% - 425px);
        border-radius: 2px 2px 0 0;
        text-transform: uppercase;
        font-family: 'JetBrains Mono', monospace;
        z-index: 2;
        box-shadow: 0 -2px 10px rgba(0, 212, 255, 0.2);
    }

    /* ===== КІБЕР-КОНТЕЙНЕР ФОРМИ ===== */
    .edit-form-container {
        width: 100%;
        max-width: 850px;
        background: rgba(8, 18, 36, 0.95);
        border: 1px solid #00d4ff;
        padding: 40px;
        box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
        position: relative;
    }

    /* ХРЕСТИК ЗАКРИТТЯ */
    .close-cross {
        position: absolute;
        top: 20px;
        right: 25px;
        font-size: 30px;
        color: #6fa3c7;
        text-decoration: none;
        transition: 0.3s;
        line-height: 1;
        z-index: 10;
        font-family: 'JetBrains Mono', monospace;
    }

    .close-cross:hover {
        color: #ff4d6d; /* Колір тривоги при наведенні */
        text-shadow: 0 0 15px #ff4d6d;
        transform: rotate(90deg);
    }

    .form-group {
        margin-bottom: 30px;
        position: relative;
    }

    .form-group label {
        display: block;
        color: #00d4ff;
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* ===== ПОЛЯ ВВОДУ ===== */
    .cyber-input {
        width: 100%;
        background: rgba(5, 12, 24, 0.9);
        border: 1px solid #00d4ff;
        color: #cfefff;
        padding: 15px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
    }

    .cyber-input:focus {
        border-color: #00ff9c;
        box-shadow: 0 0 15px rgba(0, 255, 156, 0.2);
        background: rgba(0, 212, 255, 0.05);
    }

    .cyber-textarea {
        min-height: 180px;
        resize: vertical;
        line-height: 1.6;
    }

    /* ===== КАСТОМНИЙ FILE UPLOAD ===== */
    .file-upload-wrapper {
        position: relative;
        width: 100%;
        height: 55px;
        border: 1px solid #00d4ff;
        background: rgba(5, 12, 24, 0.8);
        display: flex;
        align-items: center;
        padding: 0 15px;
        cursor: pointer;
        transition: 0.3s;
        overflow: hidden;
    }

    .file-upload-wrapper:hover {
        border-color: #00ff9c;
        background: rgba(0, 255, 156, 0.05);
    }

    .file-upload-wrapper input[type="file"] {
        position: absolute;
        left: 0; top: 0; opacity: 0;
        width: 100%; height: 100%;
        cursor: pointer;
    }

    .file-upload-label {
        color: #6fa3c7;
        font-size: 13px;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .file-upload-label::before {
        content: "[ UPLOAD_MODULE ]";
        color: #00d4ff;
        font-weight: 800;
    }

    /* ===== ПРЕВ'Ю ===== */
    .current-image-preview {
        border: 1px dashed rgba(0, 212, 255, 0.3);
        padding: 20px;
        background: rgba(0, 0, 0, 0.4);
        text-align: center;
    }

    .current-image-preview img {
        max-width: 100%;
        max-height: 300px;
        border: 1px solid #00d4ff;
    }

    /* ===== ГРУПА КНОПОК ===== */
    .form-actions {
        display: flex;
        gap: 20px;
        margin-top: 20px;
    }

    .btn-update-data {
        flex: 2;
        padding: 18px;
        background: transparent;
        border: 2px solid #00ff9c;
        color: #00ff9c;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 800;
        font-size: 16px;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        transition: 0.4s;
    }

    .btn-update-data:hover {
        background: #00ff9c;
        color: #050c18;
        box-shadow: 0 0 30px rgba(0, 255, 156, 0.5);
    }

    .btn-cancel {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        border: 1px solid rgba(255, 77, 109, 0.4);
        color: #ff4d6d;
        text-decoration: none;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 13px;
        transition: 0.3s;
    }

    .btn-cancel:hover {
        background: rgba(255, 77, 109, 0.1);
        border-color: #ff4d6d;
        box-shadow: 0 0 15px rgba(255, 77, 109, 0.2);
    }

    /* АДАПТИВ */
    @media (max-width: 900px) {
        .terminal-tag { margin-left: 20px; }
        .edit-form-container { width: calc(100% - 40px); margin: 0 20px; }
        .form-actions { flex-direction: column; }
    }
</style>

<div class="main-content">

    <div class="terminal-tag">
        DATABASE: EDIT_RECORD_ID_{{ disease.id }}
    </div>

    <div class="edit-form-container">
        <a href="{% url 'home' %}" class="close-cross" title="ABORT_OPERATION">&times;</a>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label>_NAME_OF_INFECTION:</label>
                <input type="text" name="name" class="cyber-input"
                       value="{{ form.name.value|default_if_none:'' }}"
                       placeholder="ENTER_DATA...">
            </div>

            <div class="form-group">
                <label>_DETAILED_DESCRIPTION:</label>
                <textarea name="description" class="cyber-input cyber-textarea"
                          placeholder="AWAITING_INPUT...">{{ form.description.value|default_if_none:'' }}</textarea>
            </div>

            <div class="form-group">
                <label>> ПОТОЧНИЙ_МАЛЮНОК:</label>
                <div class="current-image-preview">
                    {% if disease.image %}
                        <img src="{{ disease.image.url }}" alt="Asset">
                    {% else %}
                        <span style="color: #6fa3c7;">[ NO_VISUAL_DATA_FOUND ]</span>
                    {% endif %}
                </div>
            </div>

            <div class="form-group">
                <label>_UPLOAD_NEW_ASSET:</label>
                <div class="file-upload-wrapper">
                    <div class="file-upload-label" id="fileName">
                        SELECT_NEW_DATA_STREAM...
                    </div>
                    <input type="file" name="image" onchange="updateFileName(this)">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-update-data">
                    ОНОВИТИ_ДАНІ (PUT)
                </button>
                <a href="{% url 'home' %}" class="btn-cancel">
                    ABORT_CHANGES
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    <script>
// 1. Функція для отримання CSRF-токена (необхідна для безпеки Django)
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// 2. Оновлення назви файлу (залишаємо твою логіку)
function updateFileName(input) {
    const display = document.getElementById('fileName');
    if (input.files && input.files.length > 0) {
        display.innerHTML = `> DETECTED: ${input.files[0].name}`;
        display.style.color = "#00ff9c";
    } else {
        display.innerHTML = "SELECT_NEW_DATA_STREAM...";
        display.style.color = "#6fa3c7";
    }
}

// 3. АСИНХРОННЕ ОНОВЛЕННЯ ЧЕРЕЗ МЕТОД PUT
async function sendPutRequest(event, diseaseId) {
    event.preventDefault(); // Зупиняємо стандартне перезавантаження форми

    const formData = {
        name: document.querySelector('input[name="name"]').value,
        description: document.querySelector('textarea[name="description"]').value,
        // Отримуємо масив ID вибраних симптомів
        symptoms: Array.from(document.querySelectorAll('input[name="symptoms"]:checked')).map(cb => cb.value)
    };

    try {
        const response = await fetch(`/edit/${diseaseId}/`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(formData)
        });

        if (response.ok) {
            alert("SYSTEM_UPDATE: SUCCESSFUL (Method: PUT)");
            window.location.href = '/';
        } else {
            const errorData = await response.json();
            alert("ERROR: " + (errorData.error || "Update failed"));
        }
    } catch (error) {
        console.error("Fetch error:", error);
    }
}

// Прив'язуємо функцію до кнопки "Зберегти" (заміни button type="submit" на onclick)
</script>
</script>
{% endblock %}
